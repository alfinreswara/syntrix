<!DOCTYPE html>
<html lang="id"><head>

<title>Preview Lengkap — Syntrix Landing Page</title>
<meta name="description" content="Screenshot seluruh halaman Syntrix landing page template: desktop, mobile, dan tiap section.">
<link rel="stylesheet" href="../style.css">
<style>
  body{background:#F7F4FF;color:#241f33}
  .pv{max-width:1080px;margin:0 auto;padding:56px 24px 80px}
  .pv-head{display:flex;align-items:center;gap:16px;margin-bottom:8px}
  .pv-mark{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,#8B6BFF,#6446EE);display:grid;place-items:center;box-shadow:0 12px 24px -10px rgba(100,70,238,.7)}
  .pv-mark svg{width:26px;height:26px;fill:#fff}
  .pv h1{font-size:32px;margin:0}
  .pv h1 span{color:#6446EE}
  .pv p.lede{color:#6a6478;margin:6px 0 0}
  .pv-links{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0 44px}
  .pv-links a{background:#fff;border:1px solid #e5ddfb;color:#5b4ed8;border-radius:999px;padding:9px 16px;font-size:14px;text-decoration:none;font-weight:500}
  .pv-links a.pri{background:#6446EE;color:#fff;border-color:#6446EE}
  h2{font-size:20px;margin:44px 0 18px;display:flex;align-items:center;gap:10px}
  h2::after{content:"";flex:1;height:1px;background:#e5ddfb}
  .grid{display:grid;gap:20px}
  .shot{background:#fff;border:1px solid #ece7fb;border-radius:18px;overflow:hidden;box-shadow:0 18px 40px -30px rgba(50,40,90,.5)}
  .shot a{display:block;background:#f3f0fb}
  .shot img{width:100%;display:block}
  .shot figcaption{padding:12px 16px;font-size:14px;color:#4b4657;font-weight:500}
  .mob{width:340px;margin:0 auto}
  footer{margin-top:64px;padding-top:24px;border-top:1px solid #e5ddfb;font-size:14px;color:#6a6478;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
</style></head>
